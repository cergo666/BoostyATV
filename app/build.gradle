plugins {
    alias(libs.plugins.android.application)
}

def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}
def signingStore = System.getenv('BOOSTY_KEYSTORE') ?: keystoreProperties.getProperty('storeFile')
def signingStorePassword = System.getenv('BOOSTY_KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def signingKeyAlias = System.getenv('BOOSTY_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def signingKeyPassword = System.getenv('BOOSTY_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
def hasReleaseSigning = signingStore != null && signingStorePassword != null
    && signingKeyAlias != null && signingKeyPassword != null
def versionCodeOverride = providers.gradleProperty('versionCode').orNull
def versionNameOverride = providers.gradleProperty('versionName').orNull
def baseVersionName = versionNameOverride ?: '1.1.4'
def versionMatcher = baseVersionName =~ /^(\d+)\.(\d+)\.(\d+)/
def baseVersionCode = versionMatcher.find()
    ? versionMatcher.group(1).toInteger() * 1000000 + versionMatcher.group(2).toInteger() * 1000 + versionMatcher.group(3).toInteger()
    : 1

android {
    namespace 'ru.boostyatv.client'
    compileSdk 37

    defaultConfig {
        applicationId 'ru.boostyatv.client'
        minSdk 26
        targetSdk 36
        versionCode versionCodeOverride == null ? baseVersionCode : versionCodeOverride.toInteger()
        versionName baseVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingStore)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.core
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    compileOnly libs.androidx.annotation
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.media3.exoplayer.dash
    implementation libs.androidx.media3.ui
    implementation libs.androidx.media3.session
    implementation libs.guava
    implementation libs.zxing.embedded
    testImplementation libs.junit4
    testImplementation libs.json
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
}
