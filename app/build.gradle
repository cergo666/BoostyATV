plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}
// Providers, not System.getenv: the configuration cache sees an environment change
// as an input, so a cached entry cannot keep signing values from another run.
// orElse receives an empty string, because a missing property would otherwise make
// an absent provider look present.
def envOrProperty = { String envName, String propertyName ->
    providers.environmentVariable(envName).orElse(keystoreProperties.getProperty(propertyName, ''))
}
def signingStore = envOrProperty('BOOSTY_KEYSTORE', 'storeFile')
def signingStorePassword = envOrProperty('BOOSTY_KEYSTORE_PASSWORD', 'storePassword')
def signingKeyAlias = envOrProperty('BOOSTY_KEY_ALIAS', 'keyAlias')
def signingKeyPassword = envOrProperty('BOOSTY_KEY_PASSWORD', 'keyPassword')
def signingValues = [signingStore, signingStorePassword, signingKeyAlias, signingKeyPassword]
def hasReleaseSigning = signingValues.every { it.isPresent() && !it.get().isEmpty() }
def versionCodeOverride = providers.gradleProperty('versionCode').orNull
def versionNameOverride = providers.gradleProperty('versionName').orNull
def baseVersionName = versionNameOverride ?: '2.7.0'
def versionMatcher = baseVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionMatcher.find()) {
    throw new GradleException("versionName '$baseVersionName' must look like 1.2.3")
}
def major = versionMatcher.group(1).toInteger()
def minor = versionMatcher.group(2).toInteger()
def patch = versionMatcher.group(3).toInteger()
if (minor > 999 || patch > 999) {
    throw new GradleException("versionName '$baseVersionName' has minor or patch above 999; the versionCode formula would collide with the next major")
}
def baseVersionCode = major * 1000000 + minor * 1000 + patch

android {
    namespace 'ru.boostyatv.client'
    compileSdk 37

    defaultConfig {
        applicationId 'ru.boostyatv.client'
        minSdk 26
        targetSdk 36
        versionCode versionCodeOverride == null ? baseVersionCode : versionCodeOverride.toInteger()
        versionName baseVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingStore.get())
                storePassword signingStorePassword.get()
                keyAlias signingKeyAlias.get()
                keyPassword signingKeyPassword.get()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        // CI runs :app:lintDebug explicitly; a second pass inside assembleRelease
        // would repeat the same checks for every build.
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

composeCompiler {
    stabilityConfigurationFiles.add(layout.projectDirectory.file('compose-stability.conf'))
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.activity.compose
    implementation libs.androidx.core
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling
    compileOnly libs.androidx.annotation
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.media3.exoplayer.dash
    implementation libs.androidx.media3.ui
    implementation libs.androidx.media3.session
    implementation libs.guava
    implementation libs.zxing.embedded
    testImplementation libs.junit4
    testImplementation libs.json
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
}
