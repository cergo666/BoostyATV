[versions]
agp = "9.4.1"
activity = "1.13.0"
annotation = "1.11.0"
core = "1.18.0"
guava = "33.3.1-android"
media3 = "1.11.1"
recyclerview = "1.4.0"
swiperefreshlayout = "1.2.0"
zxing = "4.3.0"
junit = "4.13.2"
json = "20260814"
