name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса, например 1.0.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if ((10#$MINOR > 999 || 10#$PATCH > 999)); then
            echo "::error::Minor and patch must be between 0 and 999"
            exit 1
          fi
          CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore
        shell: bash
        env:
          BOOSTY_KEYSTORE_BASE64: ${{ secrets.BOOSTY_KEYSTORE_BASE64 }}
          BOOSTY_KEYSTORE_PASSWORD: ${{ secrets.BOOSTY_KEYSTORE_PASSWORD }}
          BOOSTY_KEY_ALIAS: ${{ secrets.BOOSTY_KEY_ALIAS }}
          BOOSTY_KEY_PASSWORD: ${{ secrets.BOOSTY_KEY_PASSWORD }}
        run: |
          missing=0
          for name in BOOSTY_KEYSTORE_BASE64 BOOSTY_KEYSTORE_PASSWORD BOOSTY_KEY_ALIAS BOOSTY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not configured"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            exit 1
          fi
          echo "$BOOSTY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          BOOSTY_KEYSTORE: ${{ runner.temp }}/release.jks
          BOOSTY_KEYSTORE_PASSWORD: ${{ secrets.BOOSTY_KEYSTORE_PASSWORD }}
          BOOSTY_KEY_ALIAS: ${{ secrets.BOOSTY_KEY_ALIAS }}
          BOOSTY_KEY_PASSWORD: ${{ secrets.BOOSTY_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          bash gradlew :app:testDebugUnitTest :app:assembleRelease --parallel \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"
      - name: Rename APK for the in-app updater
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BoostyATV.apk
          sha256sum app/build/outputs/apk/release/BoostyATV.apk
      - name: Upload R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/BoostyATV.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
