name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса, например 1.0.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if ((10#$MINOR > 999 || 10#$PATCH > 999)); then
            echo "::error::Minor and patch must be between 0 and 999"
            exit 1
          fi
          CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOSTY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret BOOSTY_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          BOOSTY_KEYSTORE: ${{ runner.temp }}/release.jks
          BOOSTY_KEYSTORE_PASSWORD: ${{ secrets.BOOSTY_KEYSTORE_PASSWORD }}
          BOOSTY_KEY_ALIAS: ${{ secrets.BOOSTY_KEY_ALIAS }}
          BOOSTY_KEY_PASSWORD: ${{ secrets.BOOSTY_KEY_PASSWORD }}
        run: |
          bash gradlew :app:testDebugUnitTest :app:assembleRelease --parallel \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
      - name: Rename APK for the in-app updater
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BoostyATV.apk
          sha256sum app/build/outputs/apk/release/BoostyATV.apk
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/BoostyATV.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
