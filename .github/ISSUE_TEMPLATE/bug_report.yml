name: Сообщение об ошибке
description: Что-то работает не так
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не прикладывайте токены, номера телефонов и полные HAR-файлы.
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Видно в «⋯ → О программе» или в имени APK
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: Xiaomi Mi Box S, Android TV 9
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ленту
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи или скриншоты
      description: Удалите из логов токены и персональные данные
      render: shell
    validations:
      required: false
